<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Makro Image Rectangle Checker - v3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    h2 { font-size: 1.2rem; margin: 24px 0 8px; }
    p.description { margin-top: 0; color: #555; font-size: 0.95rem; }
    .section { margin-top: 16px; padding-top: 12px; border-top: 1px solid #e5e7eb; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0 8px; align-items: center; }
    input[type="file"] { padding: 6px 0; font-size: 0.9rem; }
    button {
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 0.9rem;
      cursor: pointer;
      background: #111827;
      color: #fff;
      transition: background 0.15s ease;
    }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    button:not(:disabled):hover { background: #020617; }
    #status { margin: 4px 0 12px; font-size: 0.9rem; color: #374151; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; }
    thead { position: sticky; top: 0; background: #f9fafb; z-index: 1; }
    th, td { border: 1px solid #e5e7eb; padding: 8px 6px; text-align: left; vertical-align: middle; }
    th { font-weight: 600; font-size: 0.8rem; white-space: nowrap; }
    td img { display: block; max-height: 80px; max-width: 120px; object-fit: contain; }
    .table-wrapper { max-height: 500px; overflow: auto; margin-top: 8px; border-radius: 8px; border: 1px solid #e5e7eb; }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge-y { background: #dcfce7; color: #166534; }
    .badge-n { background: #fee2e2; color: #b91c1c; }
    .badge-pending { background: #e5e7eb; color: #374151; }
    .hint { font-size: 0.8rem; color: #6b7280; margin-top: 4px; }
    .debug { background: #fef3c7; padding: 8px; border-radius: 4px; font-size: 0.8rem; margin: 8px 0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Makro Image Rectangle Checker – v3 (Debug)</h1>
    <p class="description">
      อัปโหลดไฟล์ Excel → ระบบจะเช็ครูปภาพและเติม Y/N ลงคอลัมน์ I<br>
      Y = รูปจัตุรัส (ความกว้าง = ความสูง), N = รูปสี่เหลี่ยมผืนผ้า
    </p>

    <div class="section">
      <div class="controls">
        <input type="file" id="fileInput" accept=".xlsx,.xls">
        <button id="downloadBtn" disabled>ดาวน์โหลด Excel ที่ใส่ Y/N แล้ว</button>
      </div>
      <div id="status">ยังไม่ได้เลือกไฟล์</div>
      <div id="debugInfo" class="debug" style="display:none;"></div>

      <div class="table-wrapper">
        <table id="resultTable">
          <thead>
            <tr>
              <th>Sheet</th>
              <th>Row</th>
              <th>SKU</th>
              <th>Product Name</th>
              <th>Image Link</th>
              <th>Preview</th>
              <th>จัตุรัส 1:1</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const statusEl = document.getElementById("status");
    const debugInfo = document.getElementById("debugInfo");
    const tableBody = document.querySelector("#resultTable tbody");
    const downloadBtn = document.getElementById("downloadBtn");

    let workbook = null;
    let pendingCount = 0;

    function convertDriveUrl(originalUrl) {
      if (!originalUrl) return null;
      let url = originalUrl;
      
      // ลบ formula ถ้ามี
      if (typeof url === "string" && (url.startsWith('="') || url.startsWith("='"))) {
        url = url.slice(2, -1);
      }
      
      if (!url || typeof url !== "string") return null;
      
      const dIndex = url.indexOf("/d/");
      const viewIndex = url.indexOf("/view");
      if (dIndex === -1 || viewIndex === -1) return null;
      
      const id = url.substring(dIndex + 3, viewIndex);
      return `https://drive.google.com/uc?export=view&id=${id}`;
    }

    function updateStatus() {
      if (!workbook) {
        statusEl.textContent = "ยังไม่ได้เลือกไฟล์";
        return;
      }
      if (pendingCount > 0) {
        statusEl.textContent = `กำลังประมวลผลรูปภาพ... เหลือ ${pendingCount} รูป`;
      } else {
        statusEl.textContent = "✓ ประมวลผลรูปภาพครบแล้ว สามารถดาวน์โหลดไฟล์ Excel ได้";
        downloadBtn.disabled = false;
      }
    }

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const data = new Uint8Array(evt.target.result);
        workbook = XLSX.read(data, { type: "array" });

        tableBody.innerHTML = "";
        pendingCount = 0;
        downloadBtn.disabled = true;
        
        let totalRows = 0;
        let processedRows = 0;

        workbook.SheetNames.forEach((sheetName) => {
          const sheet = workbook.Sheets[sheetName];
          if (!sheet || !sheet['!ref']) return;

          // อ่านข้อมูลทั้งหมด
          const range = XLSX.utils.decode_range(sheet['!ref']);
          const data = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
          
          debugInfo.style.display = "block";
          debugInfo.innerHTML = `
            <strong>Sheet:</strong> ${sheetName}<br>
            <strong>Range:</strong> ${sheet['!ref']}<br>
            <strong>Total Rows:</strong> ${data.length}<br>
            <strong>Columns:</strong> ${range.e.c + 1} (A-${XLSX.utils.encode_col(range.e.c)})
          `;

          // ขยาย range ให้ครอบคลุมคอลัมน์ I (index 8)
          if (range.e.c < 8) {
            range.e.c = 8;
            sheet['!ref'] = XLSX.utils.encode_range(range);
          }

          // หา header row และเพิ่มคอลัมน์ I
          // สมมติว่า header อยู่ที่แถว 2 (index 1)
          const headerRow = 2; // Excel row number
          const headerCell = `I${headerRow}`;
          if (!sheet[headerCell] || !sheet[headerCell].v) {
            sheet[headerCell] = { t: "s", v: "รูปจัตุรัส 1:1 ไหม (Y/N)" };
          }

          // วนลูปข้อมูลจากแถว 3 เป็นต้นไป
          for (let rowIdx = 2; rowIdx < data.length; rowIdx++) {
            const row = data[rowIdx];
            if (!row || row.length === 0) continue;

            const excelRow = rowIdx + 1; // Excel row number (1-based)
            
            // อ่านข้อมูลจากคอลัมน์ต่างๆ (ปรับตาม structure จริง)
            // คอลัมน์ B = index 1, C = index 2, F = index 5
            const sku = row[1] || "";
            const name = row[2] || "";
            const imageUrl = row[5] || "";

            // ข้ามถ้าไม่มี URL รูป
            if (!imageUrl || typeof imageUrl !== "string" || !imageUrl.includes("drive.google.com")) {
              continue;
            }

            const directUrl = convertDriveUrl(imageUrl);
            if (!directUrl) continue;

            totalRows++;
            
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${sheetName}</td>
              <td>${excelRow}</td>
              <td>${sku}</td>
              <td>${name}</td>
              <td><a href="${directUrl}" target="_blank" style="font-size:0.75rem;">เปิดรูป</a></td>
              <td><img src="${directUrl}" alt="preview"></td>
              <td class="result">
                <span class="badge badge-pending">รอ...</span>
              </td>
            `;
            tableBody.appendChild(tr);

            const img = tr.querySelector("img");
            const resultCell = tr.querySelector(".result");

            pendingCount++;
            updateStatus();

            img.onload = () => {
              const w = img.naturalWidth;
              const h = img.naturalHeight;
              const isSquare = w === h;
              const flag = isSquare ? "Y" : "N";

              resultCell.innerHTML = `
                <span class="badge ${isSquare ? "badge-y" : "badge-n"}">${flag}</span>
                <span style="margin-left:4px; color:#6b7280; font-size:0.7rem;">${w}×${h}</span>
              `;

              // เขียนค่าลงคอลัมน์ I
              const cellAddr = `I${excelRow}`;
              sheet[cellAddr] = { t: "s", v: flag };

              processedRows++;
              pendingCount--;
              updateStatus();
            };

            img.onerror = () => {
              resultCell.innerHTML = `<span class="badge badge-pending">โหลดไม่ได้</span>`;
              const cellAddr = `I${excelRow}`;
              sheet[cellAddr] = { t: "s", v: "ERROR" };
              
              processedRows++;
              pendingCount--;
              updateStatus();
            };
          }
        });

        statusEl.textContent = `พบรูปภาพ ${totalRows} รูป กำลังโหลด...`;
        
        if (pendingCount === 0) {
          statusEl.textContent = "ไม่พบรูปภาพที่ต้องประมวลผล";
          downloadBtn.disabled = false;
        }
      };

      reader.readAsArrayBuffer(file);
    });

    downloadBtn.addEventListener("click", () => {
      if (!workbook) return;

      // ตรวจสอบและขยาย range ของทุก sheet
      workbook.SheetNames.forEach((sheetName) => {
        const sheet = workbook.Sheets[sheetName];
        if (!sheet || !sheet['!ref']) return;
        
        const range = XLSX.utils.decode_range(sheet['!ref']);
        if (range.e.c < 8) {
          range.e.c = 8;
          sheet['!ref'] = XLSX.utils.encode_range(range);
        }
      });

      const wbout = XLSX.write(workbook, {
        bookType: "xlsx",
        type: "array"
      });

      const blob = new Blob([wbout], {
        type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      });

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Makro_Image_with_rectangle_flag.xlsx";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
