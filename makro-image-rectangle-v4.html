<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Makro Image Rectangle Checker - v4 (Fixed)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p.description { margin-top: 0; color: #555; font-size: 0.95rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0 8px; align-items: center; }
    input[type="file"] { padding: 6px 0; font-size: 0.9rem; }
    button {
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 0.9rem;
      cursor: pointer;
      background: #111827;
      color: #fff;
      transition: background 0.15s ease;
    }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    button:not(:disabled):hover { background: #020617; }
    #status { margin: 4px 0 12px; font-size: 0.9rem; color: #374151; font-weight: 500; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; }
    thead { position: sticky; top: 0; background: #f9fafb; z-index: 1; }
    th, td { border: 1px solid #e5e7eb; padding: 8px 6px; text-align: left; vertical-align: middle; }
    th { font-weight: 600; font-size: 0.8rem; white-space: nowrap; }
    td img { display: block; max-height: 80px; max-width: 120px; object-fit: contain; }
    .table-wrapper { max-height: 500px; overflow: auto; margin-top: 8px; border-radius: 8px; border: 1px solid #e5e7eb; }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge-y { background: #dcfce7; color: #166534; }
    .badge-n { background: #fee2e2; color: #b91c1c; }
    .badge-pending { background: #e5e7eb; color: #374151; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Makro Image Rectangle Checker – v4 (แก้ไขแล้ว)</h1>
    <p class="description">
      อัปโหลดไฟล์ Excel → ระบบจะเช็ครูปภาพและเติม Y/N ลงคอลัมน์ I<br>
      <strong>Y</strong> = รูปจัตุรัส (ความกว้าง = ความสูง) | <strong>N</strong> = รูปสี่เหลี่ยมผืนผ้า
    </p>

    <div class="controls">
      <input type="file" id="fileInput" accept=".xlsx,.xls">
      <button id="downloadBtn" disabled>ดาวน์โหลด Excel ที่ใส่ Y/N แล้ว</button>
    </div>
    <div id="status">ยังไม่ได้เลือกไฟล์</div>

    <div class="table-wrapper">
      <table id="resultTable">
        <thead>
          <tr>
            <th>Sheet</th>
            <th>Row</th>
            <th>SKU</th>
            <th>Product Name</th>
            <th>Image Link</th>
            <th>Preview</th>
            <th>จัตุรัส 1:1</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const statusEl = document.getElementById("status");
    const tableBody = document.querySelector("#resultTable tbody");
    const downloadBtn = document.getElementById("downloadBtn");

    let originalWorkbook = null;
    let processedData = [];
    let pendingCount = 0;

    function convertDriveUrl(originalUrl) {
      if (!originalUrl) return null;
      let url = String(originalUrl);
      
      // ลบ formula ถ้ามี
      if (url.startsWith('="') || url.startsWith("='")) {
        url = url.slice(2, -1);
      }
      
      if (!url || !url.includes("drive.google.com")) return null;
      
      const dIndex = url.indexOf("/d/");
      const viewIndex = url.indexOf("/view");
      if (dIndex === -1 || viewIndex === -1) return null;
      
      const id = url.substring(dIndex + 3, viewIndex);
      return `https://drive.google.com/uc?export=view&id=${id}`;
    }

    function updateStatus() {
      if (!originalWorkbook) {
        statusEl.textContent = "ยังไม่ได้เลือกไฟล์";
        return;
      }
      if (pendingCount > 0) {
        statusEl.textContent = `⏳ กำลังประมวลผลรูปภาพ... เหลือ ${pendingCount} รูป`;
      } else {
        statusEl.textContent = "✅ ประมวลผลรูปภาพครบแล้ว! สามารถดาวน์โหลดไฟล์ Excel ได้";
        downloadBtn.disabled = false;
      }
    }

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const data = new Uint8Array(evt.target.result);
        originalWorkbook = XLSX.read(data, { type: "array" });

        tableBody.innerHTML = "";
        processedData = [];
        pendingCount = 0;
        downloadBtn.disabled = true;
        
        let totalImages = 0;

        originalWorkbook.SheetNames.forEach((sheetName) => {
          const sheet = originalWorkbook.Sheets[sheetName];
          if (!sheet) return;

          // แปลง sheet เป็น array of arrays
          const rows = XLSX.utils.sheet_to_json(sheet, { 
            header: 1, 
            defval: "",
            raw: false 
          });

          // วนลูปทุกแถว
          rows.forEach((row, rowIndex) => {
            const excelRow = rowIndex + 1; // Excel row number (1-based)
            
            // ข้ามแถว header (แถว 1-2)
            if (rowIndex < 2) return;
            
            // อ่านข้อมูล (ปรับ index ตามโครงสร้างไฟล์จริง)
            const sku = row[1] || ""; // คอลัมน์ B
            const name = row[2] || ""; // คอลัมน์ C
            const imageUrl = row[5] || ""; // คอลัมน์ F

            // ข้ามถ้าไม่มี URL รูป
            if (!imageUrl || !String(imageUrl).includes("drive.google.com")) {
              return;
            }

            const directUrl = convertDriveUrl(imageUrl);
            if (!directUrl) return;

            totalImages++;
            
            // เก็บข้อมูลเพื่อใช้ตอนสร้าง Excel ใหม่
            const rowData = {
              sheetName,
              excelRow,
              rowIndex,
              originalRow: [...row], // copy ข้อมูลเดิมทั้งหมด
              sku,
              name,
              imageUrl,
              directUrl,
              result: null // จะเติมทีหลัง
            };
            processedData.push(rowData);

            // แสดงในตาราง
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${sheetName}</td>
              <td>${excelRow}</td>
              <td>${sku}</td>
              <td>${name}</td>
              <td><a href="${directUrl}" target="_blank" style="font-size:0.75rem;">เปิดรูป</a></td>
              <td><img src="${directUrl}" alt="preview"></td>
              <td class="result">
                <span class="badge badge-pending">รอ...</span>
              </td>
            `;
            tableBody.appendChild(tr);

            const img = tr.querySelector("img");
            const resultCell = tr.querySelector(".result");

            pendingCount++;
            updateStatus();

            img.onload = () => {
              const w = img.naturalWidth;
              const h = img.naturalHeight;
              const isSquare = w === h;
              const flag = isSquare ? "Y" : "N";

              resultCell.innerHTML = `
                <span class="badge ${isSquare ? "badge-y" : "badge-n"}">${flag}</span>
                <span style="margin-left:4px; color:#6b7280; font-size:0.7rem;">${w}×${h}</span>
              `;

              // บันทึกผลลัพธ์
              rowData.result = flag;

              pendingCount--;
              updateStatus();
            };

            img.onerror = () => {
              resultCell.innerHTML = `<span class="badge badge-pending">โหลดไม่ได้</span>`;
              rowData.result = "ERROR";
              
              pendingCount--;
              updateStatus();
            };
          });
        });

        statusEl.textContent = `พบรูปภาพ ${totalImages} รูป กำลังโหลด...`;
        
        if (totalImages === 0) {
          statusEl.textContent = "⚠️ ไม่พบรูปภาพที่ต้องประมวลผล (ตรวจสอบว่าคอลัมน์ F มี Google Drive URL)";
        }
      };

      reader.readAsArrayBuffer(file);
    });

    downloadBtn.addEventListener("click", () => {
      if (!originalWorkbook) return;

      // สร้าง workbook ใหม่โดยคัดลอกจากต้นฉบับ
      const newWorkbook = XLSX.utils.book_new();

      originalWorkbook.SheetNames.forEach((sheetName) => {
        const originalSheet = originalWorkbook.Sheets[sheetName];
        
        // แปลง sheet เป็น array
        const rows = XLSX.utils.sheet_to_json(originalSheet, { 
          header: 1, 
          defval: "",
          raw: false 
        });

        // เพิ่มคอลัมน์ I ในแถว header (แถวที่ 2)
        if (rows.length >= 2) {
          if (!rows[1][8]) {
            rows[1][8] = "รูปจัตุรัส 1:1 ไหม (Y/N)";
          }
        }

        // เติมผลลัพธ์ลงคอลัมน์ I
        processedData.forEach(item => {
          if (item.sheetName === sheetName && item.result) {
            // ตรวจสอบว่า array มีความยาวพอหรือไม่
            while (rows[item.rowIndex].length < 9) {
              rows[item.rowIndex].push("");
            }
            rows[item.rowIndex][8] = item.result; // คอลัมน์ I = index 8
          }
        });

        // สร้าง sheet ใหม่จาก array
        const newSheet = XLSX.utils.aoa_to_sheet(rows);
        
        // คัดลอก column widths ถ้ามี
        if (originalSheet['!cols']) {
          newSheet['!cols'] = originalSheet['!cols'];
        }
        
        // คัดลอก row heights ถ้ามี
        if (originalSheet['!rows']) {
          newSheet['!rows'] = originalSheet['!rows'];
        }

        // คัดลอก merges ถ้ามี
        if (originalSheet['!merges']) {
          newSheet['!merges'] = originalSheet['!merges'];
        }

        XLSX.utils.book_append_sheet(newWorkbook, newSheet, sheetName);
      });

      // สร้างไฟล์ Excel
      const wbout = XLSX.write(newWorkbook, {
        bookType: "xlsx",
        type: "array"
      });

      const blob = new Blob([wbout], {
        type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      });

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Makro_Image_with_rectangle_flag.xlsx";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
